name: ST5 LIVE

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 2-4 * * 1-5"
    - cron: "*/5 6-7 * * 1-5"

concurrency:
  group: st5-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== BRANCH ==="
          git branch --show-current

          echo "=== SRC ==="
          ls -la src

          echo "=== CHECK LIVE.PY ==="
          test -f src/Live.py
          echo "src/live.py FOUND"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download CORE26 5M
        run: |
          cd src
          python download_core26.py

      - name: Run ST5 LIVE
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=src python src/Live.py

      - name: Show LIVE state
        if: always()
        run: |
          echo "=== LIVE STATE ==="

          if [ -f data/live_state.json ]; then
            cat data/live_state.json
          else
            echo "No live_state.json"
          fi
