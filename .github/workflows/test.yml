name: ST5 LIVE

on:
  workflow_dispatch:

  schedule:
    # 09:15 - 11:30 Vietnam (UTC+7)
    - cron: "15-55/5 2 * * 1-5"
    - cron: "*/5 3 * * 1-5"
    - cron: "0-30/5 4 * * 1-5"

    # 13:00 - 14:30 Vietnam (UTC+7)
    - cron: "*/5 6 * * 1-5"
    - cron: "0-30/5 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: st5-live
  cancel-in-progress: false

jobs:

  live:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # CHECK REPOSITORY
      # ============================================================

      - name: Check repository
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== BRANCH ==="
          git branch --show-current

          echo "=== SRC ==="
          ls -la src

          echo "=== CHECK CORE FILES ==="
          test -f src/Live.py
          test -f src/v11_daily_engine.py
          test -f src/vre_survival_live.py
          test -f src/msr_step5_engine.py
          test -f src/msr_live.py

          echo "All ST5 LIVE files found."

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # DOWNLOAD CORE26 5M
      # ============================================================

      - name: Download CORE26 5M
        run: |
          cd src
          python download_core26.py

      # ============================================================
      # RUN MSR C4 LIVE
      # ============================================================

      - name: Run MSR C4 Live
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=src python src/msr_live.py

      # ============================================================
      # RUN ST5 LIVE CORE
      # ============================================================

      - name: Run ST5 LIVE
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=src python src/Live.py

      # ============================================================
      # RUN ST5 V1.1 DAILY
      # ============================================================

      - name: Run ST5 V1.1 Daily
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=src python src/v11_daily_engine.py

      # ============================================================
      # RUN VRE SURVIVAL V1.8
      # ============================================================

      - name: Run VRE Survival V1.8 — Step 1
        run: |
          PYTHONPATH=src python src/vre_survival_live.py

      # ============================================================
      # SHOW MSR STATE
      # ============================================================

      - name: Show MSR state
        if: always()
        run: |
          echo "=== MSR C4 STATE ==="

          if [ -f data/msr_live_state.json ]; then
            cat data/msr_live_state.json
          else
            echo "No msr_live_state.json"
          fi

      # ============================================================
      # SHOW LIVE STATE
      # ============================================================

      - name: Show LIVE state
        if: always()
        run: |
          echo "=== LIVE STATE ==="

          if [ -f data/live_state.json ]; then
            cat data/live_state.json
          else
            echo "No live_state.json"
          fi

      # ============================================================
      # SHOW V1.1 STATE
      # ============================================================

      - name: Show V1.1 state
        if: always()
        run: |
          echo "=== V1.1 DAILY STATE ==="

          if [ -f data/v11_daily_state.json ]; then
            cat data/v11_daily_state.json
          else
            echo "No v11_daily_state.json"
          fi

      # ============================================================
      # SAVE ST5 STATES
      # ============================================================

      - name: Save ST5 states
        if: always()
        run: |
          echo "=== SAVE STATES ==="

          git add \
            data/msr_live_state.json \
            data/live_state.json \
            data/v11_daily_state.json \
            data/vre_survival_state.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "ST5-LIVE Bot"
          git config user.email "st5-live-bot@users.noreply.github.com"

          git commit -m "Update ST5 LIVE states"

          git push
