name: ST5 LIVE

on:
  workflow_dispatch:

  schedule:
    # 09:15 - 11:30 Vietnam
    - cron: "15-55/5 2 * * 1-5"
    - cron: "*/5 3 * * 1-5"
    - cron: "0-30/5 4 * * 1-5"

    # 13:00 - 14:30 Vietnam
    - cron: "*/5 6 * * 1-5"
    - cron: "0-30/5 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: st5-live
  cancel-in-progress: false

jobs:

  live:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==================================================
      # CHECK REPOSITORY
      # ==================================================

      - name: Check repository
        run: |

          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== BRANCH ==="
          git branch --show-current

          echo "=== SRC ==="
          ls -la src

          echo "=== CHECK LIVE.PY ==="
          test -f src/Live.py

          echo "src/Live.py FOUND"

      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==================================================
      # INSTALL
      # ==================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

      # ==================================================
      # DOWNLOAD CORE26 5M
      # ==================================================

      - name: Download CORE26 5M
        run: |

          cd src

          python download_core26.py

      # ==================================================
      # RUN ST5 LIVE
      # ==================================================

      - name: Run ST5 LIVE
        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          PYTHONPATH=src python src/Live.py

      # ==================================================
      # SHOW STATE
      # ==================================================

      - name: Show LIVE state
        if: always()
        run: |

          echo "=== LIVE STATE ==="

          if [ -f data/live_state.json ]; then

            cat data/live_state.json

          else

            echo "No live_state.json"

          fi

      # ==================================================
      # SAVE STATE TO GITHUB
      # ==================================================

      - name: Save LIVE state
        if: always()
        run: |

          if [ ! -f data/live_state.json ]; then

            echo "No state file to save."

            exit 0

          fi

          git config user.name "ST5-LIVE Bot"

          git config user.email "st5-live-bot@users.noreply.github.com"

          git add data/live_state.json

          if git diff --cached --quiet; then

            echo "No LIVE state changes."

            exit 0

          fi

          git commit -m "Update ST5 LIVE state"

          git push
