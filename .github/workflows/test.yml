name: ST5 LIVE

on:
  workflow_dispatch:

  schedule:
    # 09:15 - 11:30 Vietnam
    - cron: "15-55/5 2 * * 1-5"
    - cron: "*/5 3 * * 1-5"
    - cron: "0-30/5 4 * * 1-5"

    # 13:00 - 14:30 Vietnam
    - cron: "*/5 6 * * 1-5"
    - cron: "0-30/5 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: st5-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # CHECK REPOSITORY
      # ============================================================

      - name: Check repository
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== BRANCH ==="
          git branch --show-current

          echo "=== SRC ==="
          ls -la src

          echo "=== CHECK LIVE.PY ==="
          test -f src/Live.py
          echo "src/Live.py FOUND"

          echo "=== CHECK V1.1 ==="
          test -f src/v11_daily_engine.py
          echo "src/v11_daily_engine.py FOUND"

          echo "=== CHECK VRE ==="
          test -f src/vre_survival_live.py
          echo "src/vre_survival_live.py FOUND"

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # DOWNLOAD CORE26 5M
      # ============================================================

      - name: Download CORE26 5M
        run: |
          cd src
          python download_core26.py

      # ============================================================
      # RUN ST5 LIVE
      # ============================================================

      - name: Run ST5 LIVE
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=src python src/Live.py

      # ============================================================
      # RUN ST5 V1.1 DAILY
      # ============================================================

      - name: Run ST5 V1.1 Daily
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=src python src/v11_daily_engine.py

      # ============================================================
      # RUN VRE SURVIVAL V1.8 — STEP 1
      # ============================================================

      - name: Run VRE Survival V1.8 — Step 1
        run: |
          PYTHONPATH=src python src/vre_survival_live.py

      # ============================================================
      # SHOW MSR STATE
      # ============================================================

      - name: Show LIVE state
        if: always()
        run: |
          echo "=== LIVE STATE ==="

          if [ -f data/live_state.json ]; then
            cat data/live_state.json
          else
            echo "No live_state.json"
          fi

      # ============================================================
      # SHOW V1.1 STATE
      # ============================================================

      - name: Show V1.1 state
        if: always()
        run: |
          echo "=== V1.1 DAILY STATE ==="

          if [ -f data/v11_daily_state.json ]; then
            cat data/v11_daily_state.json
          else
            echo "No v11_daily_state.json"
          fi

      # ============================================================
      # SAVE ST5 STATES
      # ============================================================

      - name: Save ST5 states
        if: always()
        run: |
          echo "=== SAVE STATES ==="

          if [ -f data/live_state.json ]; then
            git add data/live_state.json
            echo "Added: data/live_state.json"
          else
            echo "Skip: data/live_state.json"
          fi

          if [ -f data/v11_daily_state.json ]; then
            git add data/v11_daily_state.json
            echo "Added: data/v11_daily_state.json"
          else
            echo "Skip: data/v11_daily_state.json"
          fi

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "ST5-LIVE Bot"
          git config user.email "st5-live-bot@users.noreply.github.com"

          git commit -m "Update ST5 LIVE and V1.1 state"

          git push 
